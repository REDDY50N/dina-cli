[package]
name = "dina-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"                                      # Für einfache Fehlerbehandlung
directories = "5.0"                                 # Für plattformübergreifende Konfigurationsverzeichnisse
dirs = "5.0"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.3"
assert_cmd = "2.0"
predicates = "2.1"
mockall = "0.11"   # Für erweitertes Mocking

[features]
test = [] # Feature-Flag für Test-spezifischen Code
