[package]
name = "dina-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"                                      # Für einfache Fehlerbehandlung
directories = "5.0"                                 # Für plattformübergreifende Konfigurationsverzeichnisse

reqwest = { version = "0.12.23", features = ["json", "blocking"] }
dirs = "6.0.0"
serde_json = "1.0.142"
thiserror = "2.0.15"
